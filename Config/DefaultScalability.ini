; Medium groups for a 1024x768 desktop. Group sections stay in the engine
; defaults so only scalability-flagged variables are applied.

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=3
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=0
sg.ShadingQuality=2
sg.LandscapeQuality=0
