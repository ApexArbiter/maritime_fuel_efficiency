; RTX 5060 Ti 16 GB at the current 1024x768 desktop.
; Epic on GPU work, High foliage so the 5 CPU cores are not spent on instance culling.

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=2
sg.ShadingQuality=3
sg.LandscapeQuality=3

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1
r.Lumen.Reflections.HardwareRayTracing=1

[TextureQuality@3]
r.Streaming.PoolSize=8192
r.Streaming.LimitPoolSizeToVRAM=1
